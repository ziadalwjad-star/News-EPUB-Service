name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install test-only HTML parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.14.3
      - name: Check shell syntax
        run: sh -n bin/news-epub-build
      - name: Compile Python and recipe sources
        run: python -m py_compile bin/news-epub-validate recipe/news-epub.recipe
      - name: Run regression and hostile-input tests
        run: python -m unittest discover -s tests -v
      - name: Verify systemd calendar expressions
        run: |
          systemd-analyze calendar '*-*-* 06:00:00'
          systemd-analyze calendar '*-*-* 17:30:00'
          systemd-analyze calendar '*-*-* 22:00:00'
      - name: Verify systemd units
        run: |
          sudo install -m 0755 bin/news-epub-build /usr/local/bin/news-epub-build
          systemd-analyze verify systemd/news-epub.service systemd/news-epub.timer

  package:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build trial ZIP
        run: |
          git archive --format=zip --prefix=News-EPUB-Service/ --output=News-EPUB-Service.zip HEAD
          sha256sum News-EPUB-Service.zip > News-EPUB-Service.zip.sha256
      - name: Upload trial ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: News-EPUB-Service
          path: |
            News-EPUB-Service.zip
            News-EPUB-Service.zip.sha256
          if-no-files-found: error
          retention-days: 14
